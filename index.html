<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YWC LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Menyembunyikan elemen bawaan Blogger agar Full Page */
        .blogger-element, #navbar-iframe, .Navbar, .date-header, .post-title, .post-footer, .comments, .sidebar, .footer { display: none !important; }
        .post-body { margin: 0 !important; padding: 0 !important; }
        
        /* UI Utilities */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-dark { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Layout Responsif */
        @media (max-width: 768px) {
            .admin-sidebar { display: none; }
            .admin-bottom-nav { display: flex; }
            .admin-main { padding-bottom: 80px; }
        }
        @media (min-width: 769px) {
            .admin-bottom-nav { display: none; }
            .admin-main { margin-left: 16rem; }
        }
        
        /* Loader */
        .loader { border: 4px solid #e2e8f0; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col w-full absolute top-0 left-0 bg-[#f8fafc] z-[999]"></div>
    <div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
    <div id="modal-container"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // ==========================================
        // 1. KONFIGURASI APLIKASI
        // ==========================================
        const IS_PREVIEW = false; // UBAH INI JADI false SAAT DEPLOY
        
        const firebaseConfig = {
          apiKey: "AIzaSyD1ZNKPytA4ykItiwdey0Mp4PnfXxouvWE",
          authDomain: "ywc-lc.firebaseapp.com",
          projectId: "ywc-lc",
          storageBucket: "ywc-lc.firebasestorage.app",
          messagingSenderId: "925032565196",
          appId: "1:925032565196:web:57f1d3a27096d2da00b569"
        };
        
        let app, auth, db;
        if (!IS_PREVIEW) {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } catch (e) {
                console.error("Firebase init error", e);
            }
        }

        // ==========================================
        // 2. STATE MANAGER & HELPER
        // ==========================================
        const state = {
            user: null, // role: 'admin' atau 'student'
            settings: {
                nama_platform: "YWC LMS",
                founder_nama: "A. Permana, A.Md., S.H.",
                founder_jabatan: "Founder Yeswecan Tech",
                founder_pesan: "Saya percaya setiap orang berhak mendapat akses ilmu yang bermutu...",
                logo_url: "",
                founder_foto: ""
            },
            loginRole: 'student'
        };
        const appEl = document.getElementById('app');
        
        const showToast = (msg, type = 'success') => {
            const t = document.createElement('div');
            t.className = `px-6 py-3 rounded-xl shadow-2xl fade-in text-white font-bold text-sm flex items-center gap-3 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            t.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} text-lg"></i> ${msg}`;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };
        
        const generateRandomPassword = (length = 8) => {
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&";
            let retVal = "";
            for (let i = 0, n = charset.length; i < length; ++i) {
                retVal += charset.charAt(Math.floor(Math.random() * n));
            }
            return retVal;
        };
        
        // Helper untuk Google Drive Image & Video
        const getGDriveThumbnail = (url) => {
            if(!url) return '';
            const match = url.match(/[-\w]{25,}/);
            return match ? `https://drive.google.com/thumbnail?id=${match[0]}&sz=w800` : url;
        };
        const getGDriveEmbed = (url) => {
            if(!url) return '';
            const match = url.match(/[-\w]{25,}/);
            return match ? `https://drive.google.com/file/d/${match[0]}/preview` : url;
        };
        
        const imageFallback = "onerror=\"this.onerror=null;this.src='https://placehold.co/800x400/e2e8f0/475569?text=Image';\"";
        const avatarFallback = "onerror=\"this.onerror=null;this.src='https://placehold.co/200x200/e2e8f0/475569?text=User';\"";
        
        // Helper FullScreen
        window.toggleFullScreen = (elementId) => {
            const el = document.getElementById(elementId);
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) { el.requestFullscreen(); }
                else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); } // Safari
                else if (el.msRequestFullscreen) { el.msRequestFullscreen(); } // IE11
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                else if (document.msExitFullscreen) { document.msExitFullscreen(); }
            }
        };

        // ==========================================
        // 3. AUTO SETUP DATABASE DUMMY
        // ==========================================
        const autoSetupDatabase = async () => {
            if(IS_PREVIEW) return;
            try {
                const sSnap = await getDoc(doc(db, "settings", "platform_config"));
                if(!sSnap.exists()) {
                    showToast("Menyiapkan database awal...", "success");
                    await setDoc(doc(db, "settings", "platform_config"), state.settings);
                    const cRef = doc(collection(db, "courses"));
                    await setDoc(cRef, { id: cRef.id, judul: "Kursus Demo", deskripsi: "Ini kursus pertama Anda.", thumbnail_url: "", jumlah_siswa: 1, link_pembayaran: "" });
                    const mRef = doc(collection(db, "modules"));
                    await setDoc(mRef, { id: mRef.id, course_id: cRef.id, urutan: 1, judul_modul: "Video Pembukaan", tipe: "video", konten_url: "https://www.youtube.com/embed/dQw4w9WgXcQ" });
                    const uRef = doc(collection(db, "users"));
                    await setDoc(uRef, { id: uRef.id, nama: "Siswa Demo", email: "siswa@ywc.com", password: "password123", role: "student" });
                    const eRef = doc(collection(db, "enrollments"));
                    await setDoc(eRef, { id: eRef.id, user_id: uRef.id, course_id: cRef.id, progress_percent: 0 });
                    showToast("Setup selesai! Silakan refresh halaman.");
                } else {
                    state.settings = sSnap.data();
                }
            } catch(e) { console.error("Setup error", e); }
        };

        // ==========================================
        // 4. RENDERER HALAMAN PUBLIK & LOGIN
        // ==========================================
        window.renderLanding = async () => {
            appEl.innerHTML = `<div class="flex items-center justify-center h-screen"><div class="loader"></div></div>`;
            
            let courses = [];
            if(!IS_PREVIEW) {
                try {
                    const snap = await getDocs(collection(db, "courses"));
                    courses = snap.docs.map(d => ({id: d.id, ...d.data()}));
                } catch(e) {}
            } else {
                courses = [
                    {id: '1', judul: 'Membuat Website dengan AI', deskripsi: 'Belajar membuat web dengan AI cepat dan praktis.', thumbnail_url: '', jumlah_siswa: 15}
                ];
            }
            let courseHtml = courses.map(c => `
                <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition duration-300 flex flex-col">
                    <img src="${getGDriveThumbnail(c.thumbnail_url)}" ${imageFallback} class="w-full h-48 object-cover">
                    <div class="p-6 flex-1 flex flex-col">
                        <div class="text-xs font-bold text-indigo-600 mb-2 bg-indigo-50 self-start px-3 py-1 rounded-full"><i class="fas fa-users"></i> ${c.jumlah_siswa || 0} Siswa</div>
                        <h4 class="font-bold text-xl mb-3 text-gray-800 leading-tight">${c.judul}</h4>
                        <p class="text-sm text-gray-600 mb-6 line-clamp-2 flex-1">${c.deskripsi}</p>
                        <button onclick="renderCourseDetail('${c.id}')" class="w-full bg-gray-50 text-indigo-700 py-3 rounded-xl font-bold hover:bg-gray-100 transition mt-auto border border-gray-200 shadow-sm">Lihat Detail</button>
                    </div>
                </div>
            `).join('');
            
            const s = state.settings;
            appEl.innerHTML = `
                <nav class="glass fixed w-full top-0 z-50 border-b">
                    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            ${s.logo_url ? `<img src="${getGDriveThumbnail(s.logo_url)}" class="h-8" ${imageFallback}>` : '<div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl">Y</div>'}
                            <span class="font-extrabold text-2xl text-gray-800 tracking-tight">${s.nama_platform || 'LMS'}</span>
                        </div>
                        <button onclick="renderLogin()" class="bg-indigo-600 text-white px-8 py-2.5 rounded-full font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Login</button>
                    </div>
                </nav>
                
                <header class="pt-40 pb-24 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-indigo-600 text-white text-center px-4 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/90 to-blue-800/90"></div>
                    <div class="max-w-4xl mx-auto relative z-10">
                        <span class="px-5 py-1.5 rounded-full bg-white/10 text-xs font-bold tracking-widest uppercase backdrop-blur-md mb-8 inline-block border border-white/20">Platform Pembelajaran Digital</span>
                        <h1 class="text-4xl md:text-6xl font-black mb-6 leading-tight tracking-tight">Tingkatkan Keahlian Anda Bersama Kami</h1>
                        <p class="text-lg md:text-xl text-indigo-100 mb-10 max-w-2xl mx-auto">Akses materi eksklusif terstruktur dan dapatkan sertifikasi profesional langsung dari ahlinya.</p>
                        <a href="#courses" class="bg-white text-indigo-900 px-10 py-4 rounded-full font-bold shadow-2xl hover:bg-gray-50 transition inline-block text-lg">Lihat Katalog Kursus <i class="fas fa-arrow-down ml-2"></i></a>
                    </div>
                </header>
                <section class="py-20 bg-white px-4 relative">
                    <div class="max-w-4xl mx-auto text-center relative z-10">
                        <h3 class="text-sm font-bold text-indigo-600 uppercase tracking-widest mb-10 border-b-2 border-indigo-100 inline-block pb-3">Sambutan Founder</h3>
                        <img src="${getGDriveThumbnail(s.founder_foto)}" ${avatarFallback} class="w-40 h-40 rounded-full mx-auto object-cover border-8 border-indigo-50 shadow-2xl mb-8">
                        <p class="text-xl md:text-2xl italic text-gray-600 mb-8 px-4 font-light">"${s.founder_pesan}"</p>
                        <h4 class="font-extrabold text-2xl text-gray-800 mb-1">${s.founder_nama}</h4>
                        <p class="text-indigo-600 font-bold tracking-wide">${s.founder_jabatan}</p>
                    </div>
                </section>
                <section id="courses" class="py-20 bg-gray-50 px-4 border-t border-gray-100">
                    <div class="max-w-7xl mx-auto">
                        <div class="text-center mb-16">
                            <h2 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-4">Katalog Kursus</h2>
                            <p class="text-gray-500 text-lg">Pilih program yang sesuai dengan tujuan karir Anda.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${courseHtml}
                        </div>
                    </div>
                </section>
                
                <footer class="bg-gray-900 text-gray-400 py-10 text-center text-sm border-t border-gray-800">
                    <p>&copy; ${new Date().getFullYear()} ${s.nama_platform}. All rights reserved.</p>
                </footer>
            `;
        };

        // RENDER HALAMAN DETAIL KURSUS UNTUK PUBLIK (SEBELUM LOGIN)
        window.renderCourseDetail = async (courseId) => {
            appEl.innerHTML = `<div class="flex items-center justify-center h-screen"><div class="loader"></div></div>`;
            
            let course = null;
            let modules = [];
            
            if (!IS_PREVIEW) {
                try {
                    const docSnap = await getDoc(doc(db, "courses", courseId));
                    if (docSnap.exists()) course = { id: docSnap.id, ...docSnap.data() };
                    const mSnap = await getDocs(query(collection(db, "modules"), where("course_id", "==", courseId)));
                    modules = mSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.urutan - b.urutan);
                } catch(e) { console.error(e); }
            }

            if(!course) {
                appEl.innerHTML = `<div class="text-center mt-20 font-bold text-gray-500">Kursus tidak ditemukan. <br><br> <button onclick="renderLanding()" class="bg-indigo-600 text-white px-6 py-2 rounded-full">Kembali</button></div>`;
                return;
            }

            const s = state.settings;
            appEl.innerHTML = `
                <nav class="glass fixed w-full top-0 z-50 border-b">
                    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="renderLanding()">
                            ${s.logo_url ? `<img src="${getGDriveThumbnail(s.logo_url)}" class="h-8" ${imageFallback}>` : '<div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl">Y</div>'}
                            <span class="font-extrabold text-2xl text-gray-800 tracking-tight">${s.nama_platform || 'LMS'}</span>
                        </div>
                        <button onclick="renderLogin()" class="bg-indigo-600 text-white px-8 py-2.5 rounded-full font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Login</button>
                    </div>
                </nav>

                <div class="pt-32 pb-20 px-4 max-w-5xl mx-auto min-h-screen fade-in flex flex-col">
                    <button onclick="renderLanding()" class="mb-6 text-indigo-600 font-bold hover:text-indigo-800 flex items-center gap-2 transition bg-white px-5 py-2.5 rounded-full shadow-sm border border-gray-100 self-start">
                        <i class="fas fa-arrow-left"></i> Kembali ke Katalog
                    </button>
                    
                    <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-gray-100 flex flex-col lg:flex-row">
                        <div class="w-full lg:w-2/5 relative">
                            <img src="${getGDriveThumbnail(course.thumbnail_url)}" ${imageFallback} class="w-full h-64 lg:h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900/80 to-transparent flex items-end p-6 lg:hidden">
                                <div class="text-xs font-bold text-white bg-white/20 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/30"><i class="fas fa-users mr-2"></i> ${course.jumlah_siswa || 0} Siswa Mendaftar</div>
                            </div>
                        </div>
                        <div class="p-8 lg:p-12 w-full lg:w-3/5 flex flex-col justify-center">
                            <div class="hidden lg:inline-block text-xs font-bold text-indigo-600 mb-4 bg-indigo-50 px-4 py-1.5 rounded-full self-start border border-indigo-100"><i class="fas fa-users mr-2"></i> ${course.jumlah_siswa || 0} Siswa Terdaftar</div>
                            <h1 class="text-3xl lg:text-4xl font-black text-gray-800 mb-4 leading-tight">${course.judul}</h1>
                            <p class="text-gray-600 text-lg mb-8 leading-relaxed">${course.deskripsi}</p>
                            
                            <div class="bg-gray-50 rounded-3xl p-6 border border-gray-100">
                                <h3 class="font-extrabold text-gray-800 mb-4 flex items-center gap-2"><i class="fas fa-list-ul text-indigo-500"></i> Kurikulum / Materi Kursus:</h3>
                                <ul class="space-y-3 max-h-48 overflow-y-auto pr-2" style="scrollbar-width: thin;">
                                    ${modules.length > 0 ? modules.map(m => `
                                        <li class="flex items-start gap-3 text-sm font-semibold text-gray-700 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                                            <div class="w-6 h-6 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 text-[10px]"><i class="${m.tipe.includes('video') ? 'fas fa-play' : 'fas fa-file-alt'}"></i></div>
                                            <span class="mt-0.5">${m.judul_modul}</span>
                                        </li>
                                    `).join('') : '<li class="text-gray-500 italic text-sm">Silabus materi belum tersedia.</li>'}
                                </ul>
                            </div>
                            
                            ${course.link_pembayaran 
                                ? `<a href="${course.link_pembayaran}" target="_blank" class="w-full block text-center bg-green-500 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-600 transition shadow-lg shadow-green-200 mt-8">
                                    <i class="fas fa-shopping-cart mr-2"></i> Daftar Sekarang
                                   </a>
                                   <p class="text-center text-xs text-gray-500 mt-4">Sudah punya akun? <button onclick="renderLogin()" class="text-indigo-600 font-bold hover:underline">Login di sini</button></p>`
                                : `<button onclick="renderLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 mt-8">
                                    <i class="fas fa-lock"></i> Login untuk Mengakses Kursus
                                   </button>`
                            }
                        </div>
                    </div>
                </div>
                
                <footer class="bg-gray-900 text-gray-400 py-10 text-center text-sm border-t border-gray-800 mt-auto">
                    <p>&copy; ${new Date().getFullYear()} ${s.nama_platform}. All rights reserved.</p>
                </footer>
            `;
        };

        window.renderLogin = () => {
            appEl.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gray-50 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] fade-in">
                    <div class="bg-white p-8 md:p-10 rounded-[2rem] shadow-2xl max-w-md w-full relative overflow-hidden border border-gray-100">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 to-blue-500"></div>
                        <div class="text-center mb-8">
                             <div class="w-16 h-16 bg-indigo-50 rounded-2xl mx-auto flex items-center justify-center text-indigo-600 text-3xl mb-4 shadow-inner"><i class="fas fa-graduation-cap"></i></div>
                             <h2 class="text-2xl font-black text-gray-800">Selamat Datang</h2>
                             <p class="text-sm text-gray-500 mt-2">Silakan masuk ke akun Anda</p>
                        </div>
                        
                        <div class="flex bg-gray-100 rounded-xl p-1.5 mb-8">
                            <button id="tab-student" class="flex-1 py-2.5 rounded-lg font-bold text-sm bg-white shadow-sm text-indigo-600 transition" onclick="toggleLoginTab('student')">Siswa</button>
                            <button id="tab-admin" class="flex-1 py-2.5 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition" onclick="toggleLoginTab('admin')">Administrator</button>
                        </div>
                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <div class="mb-5">
                                <label class="block text-xs font-extrabold text-gray-500 uppercase mb-2 tracking-wide">Email / Username</label>
                                <input type="email" id="loginEmail" required class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                            </div>
                            <div class="mb-8">
                                <label class="block text-xs font-extrabold text-gray-500 uppercase mb-2 tracking-wide">Password</label>
                                <input type="password" id="loginPassword" required class="w-full px-5 py-3.5 rounded-xl bg-gray-50 border border-gray-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 flex justify-center items-center gap-2 text-lg">
                                Masuk <i class="fas fa-sign-in-alt"></i>
                            </button>
                            <button type="button" onclick="renderLanding()" class="w-full mt-6 text-gray-400 text-sm font-bold hover:text-indigo-600 transition flex items-center justify-center gap-2">
                                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
                            </button>
                        </form>
                    </div>
                </div>
            `;
            state.loginRole = 'student';
        };
        window.toggleLoginTab = (tab) => {
            state.loginRole = tab;
            const sBtn = document.getElementById('tab-student');
            const aBtn = document.getElementById('tab-admin');
            
            if(tab === 'student') {
                sBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm bg-white shadow-sm text-indigo-600 transition";
                aBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition";
            } else {
                aBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm bg-white shadow-sm text-indigo-600 transition";
                sBtn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-700 transition";
            }
        };
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            if(IS_PREVIEW) {
                setTimeout(() => {
                    if(state.loginRole === 'admin') {
                        state.user = { role: 'admin', email: email };
                        renderAdminPanel();
                    } else {
                        state.user = { role: 'student', id: '1', nama: 'Siswa Demo', email: email };
                        renderStudentPanel();
                    }
                    showToast("Login Preview Berhasil");
                }, 1000);
                return;
            }
            try {
                if(state.loginRole === 'admin') {
                    await signInWithEmailAndPassword(auth, email, pass);
                    state.user = { role: 'admin', email: email };
                    renderAdminPanel();
                } else {
                    const snap = await getDocs(query(collection(db, "users"), where("email", "==", email), where("password", "==", pass)));
                    if(snap.empty) throw new Error("Kredensial salah atau pengguna tidak ditemukan.");

                    const listHtml = window.currentModules.map((m, idx) => {
                        const isCompleted = window.currentEnrollment?.completed_modules?.includes(m.id);
                        const icon = isCompleted ? `<i class="fas fa-check text-white"></i>` : m.urutan;
                        const iconBg = isCompleted ? `bg-green-500 shadow-green-200` : `bg-gray-100 text-gray-400 group-hover:bg-indigo-600 group-hover:text-white`;
                        return `
                            <button onclick="window.loadModule(${idx})" id="btn-mod-${idx}" class="text-left p-4 rounded-2xl border border-transparent hover:bg-gray-50 transition w-full flex items-center gap-4 group">
                                <div id="icon-mod-${idx}" class="w-10 h-10 rounded-xl flex items-center justify-center text-sm font-black transition shadow-sm ${iconBg}">${icon}</div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-extrabold text-gray-800 truncate mb-1">${m.judul_modul}</p>
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${m.tipe.replace('_', ' ')}</p>
                                </div>
                            </button>
                        `;
                    }).join('');
                    const container = document.getElementById('module-list');
                    if(container) container.innerHTML = listHtml;
                    return listHtml; 
                };
                
                el.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-8 h-full pb-10 fade-in">
                        <div class="w-full lg:w-3/4 flex flex-col gap-4">
                            <button onclick="studentRender.dashboard()" class="self-start text-sm text-gray-500 hover:text-indigo-600 font-bold transition flex items-center gap-2 bg-white px-5 py-2.5 rounded-full shadow-sm border border-gray-100"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</button>
                            
                            <div class="bg-black rounded-3xl overflow-hidden shadow-2xl border border-gray-900 flex items-center justify-center relative group select-none" id="player-wrapper" oncontextmenu="return false;">
                                <div id="player-container" class="w-full h-full relative">
                                    <!-- Player disuntikkan di sini -->
                                </div>
                                <button onclick="toggleFullScreen('player-wrapper')" class="absolute top-4 right-4 bg-black/60 hover:bg-black/80 text-white w-10 h-10 rounded-xl flex items-center justify-center backdrop-blur-md transition shadow border border-white/20 z-10" title="Layar Penuh"><i class="fas fa-expand"></i></button>
                            </div>
                            
                            <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 mt-2">
                                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                    <div>
                                        <span class="bg-indigo-50 text-indigo-600 text-xs font-black px-3 py-1 rounded-full uppercase tracking-widest mb-3 inline-block" id="player-type">VIDEO</span>
                                        <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-2 leading-tight" id="player-title">Judul Materi</h2>
                                        <p class="text-gray-500 font-semibold text-sm"><i class="fas fa-book text-indigo-400 mr-2"></i> ${courseTitle}</p>
                                    </div>
                                    <div id="action-complete"></div>
                                </div>
                                
                                <div class="flex border-b border-gray-100 mb-6 gap-2 md:gap-6 overflow-x-auto" style="scrollbar-width: none;">
                                    <button onclick="switchTab('info')" id="tab-info" class="px-2 py-3 border-b-2 border-indigo-600 font-bold text-indigo-600 whitespace-nowrap text-sm"><i class="fas fa-info-circle mr-2"></i>Info Materi</button>
                                    <button onclick="switchTab('catatan')" id="tab-catatan" class="px-2 py-3 border-b-2 border-transparent font-bold text-gray-500 hover:text-indigo-600 whitespace-nowrap text-sm transition"><i class="fas fa-edit mr-2"></i>Catatan Pribadi</button>
                                    <button onclick="switchTab('diskusi')" id="tab-diskusi" class="px-2 py-3 border-b-2 border-transparent font-bold text-gray-500 hover:text-indigo-600 whitespace-nowrap text-sm transition"><i class="fas fa-comments mr-2"></i>Ruang Diskusi</button>
                                </div>
                                
                                <div id="content-info" class="tab-pane block fade-in"><p class="text-gray-600 text-sm leading-relaxed">Pelajari materi di atas dengan seksama. Klik tombol <b>"Tandai Selesai"</b> untuk memperbarui progress persentase belajar Anda.</p></div>
                                
                                <div id="content-catatan" class="tab-pane hidden fade-in">
                                    <div class="bg-yellow-50/50 p-1 rounded-2xl border border-yellow-100">
                                        <textarea id="note-text" rows="5" class="w-full p-4 bg-transparent outline-none text-gray-700 leading-relaxed resize-y" placeholder="Ketik catatan penting Anda untuk materi di kursus ini...">${notesData.content || ''}</textarea>
                                    </div>
                                    <div class="flex justify-end mt-3"><button id="btn-save-note" onclick="studentAction.saveNote('${courseId}')" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-indigo-700 transition"><i class="fas fa-save mr-2"></i>Simpan Catatan</button></div>
                                </div>
                                
                                <div id="content-diskusi" class="tab-pane hidden fade-in">
                                    <div class="flex gap-3 mb-6">
                                        <div class="w-10 h-10 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center font-black text-sm shrink-0 uppercase">${state.user?.nama?.charAt(0) || 'U'}</div>
                                        <div class="flex-1 flex gap-2">
                                            <input type="text" id="diskusi-text" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold transition" placeholder="Tulis pertanyaan...">
                                            <button id="btn-post-diskusi" onclick="studentAction.postDiskusi()" class="bg-indigo-600 text-white px-5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-sm"><i class="fas fa-paper-plane"></i></button>
                                        </div>
                                    </div>
                                    <h4 class="font-bold text-gray-800 mb-4 text-sm uppercase tracking-wider border-b border-gray-100 pb-2">Diskusi Materi Ini</h4>
                                    <div id="diskusi-list" class="flex flex-col gap-4 max-h-[400px] overflow-y-auto pr-2"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="w-full lg:w-1/4">
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 sticky top-6 max-h-[calc(100vh-40px)] flex flex-col">
                                <h3 class="font-extrabold text-gray-800 mb-6 flex items-center gap-3"><div class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center"><i class="fas fa-list-ul"></i></div> Daftar Materi</h3>
                                <div class="overflow-y-auto flex-1 pr-2 flex flex-col gap-2" id="module-list">${window.renderModuleList()}</div>
                            </div>
                        </div>
                    </div>
                `;
                
                window.loadModule = (idx) => {
                    const m = window.currentModules[idx];
                    window.currentModuleId = m.id; 
                    document.getElementById('player-title').innerText = m.judul_modul;
                    document.getElementById('player-type').innerText = m.tipe.replace('_', ' ').toUpperCase();
                    
                    const wrapper = document.getElementById('player-wrapper');
                    const container = document.getElementById('player-container');
                    
                    // Logika Ukuran dan Render Player berdasarkan Tipe
                    if (m.tipe === 'text') {
                        wrapper.className = "bg-white rounded-3xl overflow-hidden h-[60vh] md:h-[600px] shadow-sm border border-gray-100 text-gray-700 leading-relaxed relative group select-none";
                        container.innerHTML = `<div class="prose max-w-none p-8 h-full overflow-y-auto">${m.konten_url}</div>`;
                    } else if (m.tipe === 'gdrive_pdf') {
                        wrapper.className = "bg-gray-100 rounded-3xl overflow-hidden h-[65vh] md:h-[800px] shadow-2xl border border-gray-200 relative group select-none";
                        container.innerHTML = `<iframe src="${getGDriveEmbed(m.konten_url)}" class="w-full h-full border-0" allow="autoplay; fullscreen"></iframe>`;
                    } else if (m.tipe === 'gdrive_video') {
                        wrapper.className = "bg-black rounded-3xl overflow-hidden aspect-video shadow-2xl border border-gray-900 relative group select-none";
                        container.innerHTML = `<iframe src="${getGDriveEmbed(m.konten_url)}" class="w-full h-full border-0" allow="autoplay; fullscreen"></iframe>`;
                    } else { // YouTube
                        wrapper.className = "bg-black rounded-3xl overflow-hidden aspect-video shadow-2xl border border-gray-900 relative group select-none";
                        let src = m.konten_url;
                        if(src.includes('watch?v=')) src = src.replace('watch?v=', 'embed/');
                        // Menambahkan parameter rel=0 dan modestbranding untuk keamanan dasar youtube
                        src = src.includes('?') ? `${src}&rel=0&modestbranding=1` : `${src}?rel=0&modestbranding=1`;
                        container.innerHTML = `<iframe src="${src}" class="w-full h-full border-0 pointer-events-auto" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
                    }
                    
                    const isCompleted = window.currentEnrollment?.completed_modules?.includes(m.id);
                    document.getElementById('action-complete').innerHTML = `
                        <button id="btn-mark-complete" onclick="studentAction.toggleComplete(${idx})" class="px-5 py-3 rounded-xl font-bold text-sm flex items-center gap-2 transition shadow-sm ${isCompleted ? 'bg-green-50 text-green-600 hover:bg-green-100 border border-green-200' : 'bg-gray-800 text-white hover:bg-gray-700'}">
                            <i class="fas ${isCompleted ? 'fa-check-circle' : 'fa-check'}"></i> ${isCompleted ? 'Materi Selesai' : 'Tandai Selesai'}
                        </button>
                    `;
                    
                    document.querySelectorAll('[id^="btn-mod-"]').forEach(b => { b.classList.remove('bg-indigo-50', 'border-indigo-100'); });
                    const activeBtn = document.getElementById(`btn-mod-${idx}`);
                    if(activeBtn) { activeBtn.classList.add('bg-indigo-50', 'border-indigo-100'); }
                    
                    if(!document.getElementById('content-diskusi').classList.contains('hidden')){ studentAction.loadDiskusi(); }
                };
                window.loadModule(0);
            }
        };

        // ==========================================
        // 7. INITIALIZATION APP
        // ==========================================
        const initApp = async () => {
            if(IS_PREVIEW) {
                renderLanding();
                return;
            }
            try {
                const sSnap = await getDoc(doc(db, "settings", "platform_config"));
                if(sSnap.exists()) state.settings = sSnap.data();
                else await autoSetupDatabase();
            } catch(e) { console.log("Init setting err", e); }
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.user = { role: 'admin', email: user.email };
                    renderAdminPanel();
                } else {
                    if(!state.user || state.user.role !== 'student') {
                        renderLanding();
                    }
                }
            });
        };
        initApp();
    </script>
</body>
</html>
